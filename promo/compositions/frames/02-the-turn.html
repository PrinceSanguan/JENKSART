          var rows = [];

            var a0 = nx() * Math.PI * 2;
            var r0 = 560 + 760 * nx();
            var ta = nx() * Math.PI * 2;
            var tr = 30 + 190 * Math.sqrt(nx());
            var a2 = nx() * Math.PI * 2;
            var r2 = 150 + 620 * Math.sqrt(nx());
            var t0 = 0.02 + 0.44 * nx();
            var span = 0.3 + 0.26 * nx();
            rows.push({
              sx: CX + Math.cos(a0) * r0,
              sy: CY + Math.sin(a0) * r0 * 1.15,
              tx: CX + Math.cos(ta) * tr,
              ty: CY + Math.sin(ta) * tr * 0.82,
              ex: CX + Math.cos(a2) * r2,
              ey: CY + Math.sin(a2) * r2 * 1.25,
              t0: t0,
              t1: Math.min(0.995, t0 + span),
              rad: 1.4 + 3.2 * nx(),
              dim: 0.45 + 0.55 * nx(),
              col: nx() < 0.34 ? CREAM : ORANGE,

          return rows;

        function clamp01(v) {
          return v < 0 ? 0 : v > 1 ? 1 : v;

          var i;
          var row;
          var cur = "";

          var y;
          var r;
          var al;

            var gIn = clamp01(p / 0.1);
            for (i = 0; i < parts.length; i += 1) {
              row = parts[i];
              var u = clamp01((p - row.t0) / (row.t1 - row.t0));
              if (u <= 0) continue;
              var e = 1 - Math.pow(1 - u, 3);
              x = row.sx + (row.tx - row.sx) * e;
              y = row.sy + (row.ty - row.sy) * e;
              r = row.rad;
              al = clamp01(u / 0.16) * row.dim * 0.92 * gIn;
              if (al <= 0.003) continue;
              if (row.col !== cur) {

                ctx.fillStyle = cur;
              }
              ctx.globalAlpha = al;
              ctx.beginPath();
              ctx.arc(x, y, r, 0, Math.PI * 2);
              ctx.fill();
            }

            var qd = (t - PA1) / (PB1 - PA1);
            var eq = 1 - Math.pow(1 - qd, 2.2);
            var tail = Math.pow(1 - qd, 1.45);
            for (i = 0; i < parts.length; i += 1) {
              row = parts[i];
              x = row.tx + (row.ex - row.tx) * eq;
              y = row.ty + (row.ey - row.ty) * eq;
              r = row.rad * (1 + 0.55 * eq);
              al = row.dim * 0.92 * tail;
              if (al <= 0.003) continue;
              if (row.col !== cur) {

                ctx.fillStyle = cur;
              }
              ctx.globalAlpha = al;
              ctx.beginPath();
              ctx.arc(x, y, r, 0, Math.PI * 2);
              ctx.fill();

        tl.to({ p: 0 }, { p: 1, duration: D, ease: "none" }, 0);

        /* ---- SCENE 1 (0.00-1.40) — one fire-orange slash, landing on the bass ----
           The wall itself does not move (handoff_in). The impact is spent in the
           stroke and its overspray bloom instead. */
        tl.fromTo(
          strokeA,
          { strokeDashoffset: lenA },
          { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
          0.3,
        );
        tl.fromTo(
          osA,
          { strokeDashoffset: lenOsA },
          { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" },
          0.3,
        );
        tl.fromTo(
          osA,
          { opacity: 0 },
          { opacity: 0.56, duration: 0.14, ease: "power2.out" },
          0.3,
        );
        tl.fromTo(
          osA,
          { opacity: 0.56 },
          { opacity: 0.26, duration: 0.46, ease: "power2.out" },
          0.44,
        );
        tl.fromTo(
          spatA,
          { opacity: 0 },
          { opacity: 1, duration: 0.24, ease: "power2.out", stagger: 0.034 },
          0.4,
        );

        /* ---- SCENE 2 (1.40-3.60) — two more strokes cross it, each on its own beat,
           and the seeded field starts converging where the three meet ---- */
        tl.fromTo(
          strokeB,
          { strokeDashoffset: lenB },
          { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" },
          1.45,
        );
        tl.fromTo(
          osB,
          { strokeDashoffset: lenOsB },
          { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
          1.45,
        );
        tl.fromTo(
          osB,
          { opacity: 0 },
          { opacity: 0.3, duration: 0.4, ease: "power2.out" },
          1.45,
        );
        tl.fromTo(
          spatB,
          { opacity: 0 },
          { opacity: 1, duration: 0.24, ease: "power2.out", stagger: 0.032 },
          1.54,
        );

        tl.fromTo(
          strokeC,
          { strokeDashoffset: lenC },
          { strokeDashoffset: 0, duration: 0.33, ease: "power2.out" },
          2.3,
        );
        tl.fromTo(
          osC,
          { strokeDashoffset: lenOsC },
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          2.3,
        );
        tl.fromTo(
          osC,
          { opacity: 0 },
          { opacity: 0.32, duration: 0.42, ease: "power2.out" },
          2.3,
        );
        tl.fromTo(
          spatC,
          { opacity: 0 },
          { opacity: 1, duration: 0.24, ease: "power2.out", stagger: 0.032 },
          2.38,
        );

        /* ---- SCENE 3 (3.60-5.60) — THE SIGNATURE TRANSFER ----
           One weight transfer, read as a single event: the mural grows out of the
           stroke cluster into the upper ~70% of frame at the same moment the
           concrete plane (the incumbent surface) yields downward and dims to 40%.
           The particle field, already converged, carries the colour outward across
           the panel and dies to exactly zero as the image lands beneath it. */
        tl.fromTo(
          muralStage,
          { opacity: 0 },
          { opacity: 1, duration: 0.18, ease: "power1.out" },
          S3,
        );
        tl.fromTo(
          muralStage,
          { clipPath: "circle(4% at 50% 80%)" },
          { clipPath: "circle(122% at 50% 80%)", duration: 0.95, ease: "power3.out" },
          S3,
        );
        tl.fromTo(
          muralStage,
          { scale: 0.9 },
          { scale: 1, duration: 1.1, ease: "power3.out" },
          S3,
        );
        // the incumbent surface yields into the space the hero now fills
        tl.fromTo(
          wallStage,
          { y: 0, opacity: 1 },
          { y: 124, opacity: 0.4, duration: 1.06, ease: "power3.inOut" },
          S3 + 0.02,
        );

        // ...and the piece resolves into finished work across the rest of the window
        if (muralMid) {
          tl.fromTo(
            muralMid,
            { opacity: 0, y: 28 },
            { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
            3.92,
          );
        }
        if (mStroke1) {
          tl.fromTo(
            mStroke1,
            { strokeDashoffset: lenM1 },
            { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
            4.26,
          );
        }
        if (mStroke2) {
          tl.fromTo(
            mStroke2,
            { strokeDashoffset: lenM2 },
            { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" },
            4.54,
          );
        }
        if (dripKids.length) {
          tl.fromTo(
            dripKids,
            { opacity: 0 },
            { opacity: 1, duration: 0.26, ease: "power2.out", stagger: 0.038 },
            4.62,
          );
        }

        /* ---- SCENE 4 (5.60-7.50) — the display line lands, then holds ----
           Ink scrim snaps open around the text (scaleX 0 -> 1), the word slams in
           on a hard power4 attack, and the fire-orange rule stub seals it a beat
           behind so the silhouette reads first. Then stillness to the cut. */
        tl.fromTo(
          plateBg,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.26, ease: "power4.out" },
          S4 - 0.04,
        );
        tl.fromTo(
          word,
          { opacity: 0, scale: 1.18, filter: "blur(14px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.44, ease: "power4.out" },
          S4 + 0.04,
        );
        tl.fromTo(
          ruleStub,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.26, ease: "power3.out" },
          6.18,
        );

        tl.seek(0);
        paint(0);

        window.__timelines = window.__timelines || {};
        window.__timelines["02-the-turn"] = tl;
      })();
    </script>

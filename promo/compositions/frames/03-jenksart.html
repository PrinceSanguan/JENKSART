    <script>
      (function () {
        "use strict";

        var FRAME_ID = "03-jenksart";
        var DURATION = 7.42;
        var TEXT = "jenksart";
        /* Scene 1 window: the spray convergence plays out completely by 1.25s - the mark
           lands on the name, then settles - so the canvas is one clear rect for the whole
           rest of the frame. */
        var IN = 1.25;
        /* Scene 3: one cue per spoken place name. */
        var CUES = [3.08, 3.8, 4.52];

        var scriptEl = document.currentScript;
        var root =
          (scriptEl &&
            scriptEl.closest &&
            scriptEl.closest('[data-composition-id="' + FRAME_ID + '"]')) ||
          document.querySelector('[data-composition-id="' + FRAME_ID + '"]') ||
          document.getElementById("root");

        var markWrap = root.querySelector(".f03-jenksart-markwrap");
        var line = root.querySelector(".f03-jenksart-mark");
        var canvas = root.querySelector(".f03-jenksart-spray");
        var hairline = root.querySelector(".f03-jenksart-hairline");
        var label = root.querySelector(".f03-jenksart-label");
        var grain = root.querySelector(".f03-jenksart-grain-texture");
        var plates = root.querySelectorAll(".f03-jenksart-plate");

        /* ---------- raster basis, sampled ONCE at mount ---------- */
        var dpr = Math.min(2, Math.max(1, Number(window.devicePixelRatio) || 1));
        var box = root.getBoundingClientRect();
        var cssW = Math.max(1, Math.round(box.width) || 1080);
        var cssH = Math.max(1, Math.round(box.height) || 1920);
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        var ctx = canvas.getContext("2d");
        var minDim = Math.min(canvas.width, canvas.height);

        var lineRect = line.getBoundingClientRect();
        var lineStyle = getComputedStyle(line);
        var centerX = (lineRect.left + lineRect.width / 2 - box.left) * dpr;
        var centerY = (lineRect.top + lineRect.height / 2 - box.top) * dpr;
        var fontFamily = lineStyle.fontFamily || "sans-serif";
        var fontPx = (parseFloat(lineStyle.fontSize) || 194) * dpr;
        /* particles inherit the mark's own frame.md token, so spray and glyph match */
        var particleColor = lineStyle.color || "#f0ece5";

        var hostDoc = root.ownerDocument || document;
        var off = hostDoc.createElement("canvas");
        off.width = canvas.width;
        off.height = canvas.height;
        var offCtx = off.getContext("2d", { willReadFrequently: true });
        offCtx.font = "900 " + fontPx + "px " + fontFamily;
        try {
          offCtx.letterSpacing = "-0.04em";
        } catch (err) {
          /* older engines: the raster runs a hair wider, targets still sit on the glyphs */
        }
        offCtx.textAlign = "center";
        offCtx.textBaseline = "middle";
        offCtx.fillStyle = "#ffffff";
        offCtx.fillText(TEXT, centerX, centerY);

        /* ---------- the particle table (one LCG pass, zero per-particle tweens) ---------- */
        var particles = (function () {
          var state = 0x9d1550f7;
          function next() {
            state = (Math.imul(1664525, state) + 1013904223) >>> 0;
            return state / 4294967296;
          }
          var data = offCtx.getImageData(0, 0, off.width, off.height).data;
          var step = Math.max(2, Math.round(minDim / 260));
          var cells = [];
          var minX = Infinity;
          var maxX = -Infinity;
          for (var y = 0; y < off.height; y += step) {
            for (var x = 0; x < off.width; x += step) {
              if (data[(y * off.width + x) * 4 + 3] > 127) {
                cells.push({ x: x, y: y });
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
              }
            }
          }
          if (cells.length === 0) {
            minX = 0;
            maxX = 1;
          }
          var span = Math.max(1, maxX - minX);
          var cap = 2800;
          var keep = cells.length > cap ? cap / cells.length : 1;
          var rows = [];
          for (var i = 0; i < cells.length; i += 1) {
            /* one draw per cell in grid order: the surviving set is a pure function of
               (raster, seed) - never of iteration timing */
            var take = next() < keep;
            if (!take) continue;
            var tx = cells[i].x;
            var ty = cells[i].y;
            var key = (tx - minX) / span;
            /* the convergence front sweeps left to right across p = [0.20, 0.82]; the
               crisp wipe below rides the SAME window at a linear ease, so the glyphs
               appear exactly where the spray has just landed */
            var at = 0.2 + 0.62 * key + 0.05 * next();
            var travel = 0.18 + 0.1 * next();
            var fade = 0.05 + 0.04 * next();
            var angle = next() * Math.PI * 2;
            rows.push({
              tx: tx,
              ty: ty,
              at: Math.min(0.9, at),
              travel: travel,
              fade: fade,
              offset: (0.1 + 0.22 * next()) * minDim,
              ox: Math.cos(angle),
              oy: Math.sin(angle),
              radius: (0.26 + 0.5 * next()) * (minDim / 200) * step * 0.5,
              dim: 0.5 + 0.5 * next(),
            });
          }
          return rows;
        })();

        function clamp01(v) {
          return v < 0 ? 0 : v > 1 ? 1 : v;
        }

        /* Pure repaint: clear, then draw every particle from (row, p). Particles fly
           cloud -> glyph and fade as they settle, so every alpha is exactly zero by
           p = 1 and Scenes 2-3 run over an empty canvas. */
        function paint(timeSeconds) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          var p = IN > 0 ? clamp01(timeSeconds / IN) : 1;
          var endClamp = clamp01((1 - p) / 0.04);
          if (endClamp === 0) return;
          ctx.fillStyle = particleColor;
          for (var i = 0; i < particles.length; i += 1) {
            var row = particles[i];
            var birth = Math.max(0, row.at - row.travel);
            var u = clamp01((p - birth) / Math.max(0.0001, row.at - birth));
            if (u <= 0) continue;
            var settled = clamp01((p - row.at) / row.fade);
            var alpha = clamp01(u / 0.16) * (1 - settled) * row.dim * endClamp;
            if (alpha <= 0.002) continue;
            var e = 1 - Math.pow(1 - u, 3);
            var dist = row.offset * (1 - e);
            ctx.globalAlpha = alpha * 0.92;
            ctx.beginPath();
            ctx.arc(row.tx + row.ox * dist, row.ty + row.oy * dist, row.radius, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        /* ---------- one paused timeline ---------- */
        var tl = gsap.timeline({
          paused: true,
          onUpdate: function () {
            paint(tl.time());
          },
        });

        /* anchor tween: inert, spans [0, D] so the painter fires on every eventful seek */
        tl.to({ p: 0 }, { p: 1, duration: DURATION, ease: "none" }, 0);

        /* Scene 1 (0.00-1.80) - the mark COMES TO EXIST: the crisp line reveals behind
           the arriving spray, along the same left-to-right front. */
        tl.fromTo(
          markWrap,
          { opacity: 0 },
          { opacity: 1, duration: IN * 0.22, ease: "power2.out" },
          IN * 0.06,
        );
        tl.fromTo(
          markWrap,
          { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: IN * 0.62, ease: "none" },
          IN * 0.2,
        );

        /* Scene 2 (1.80-3.00) - the hairline draws left to right, then the mono label flashes in */
        tl.fromTo(
          hairline,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.52, ease: "power3.inOut" },
          1.82,
        );
        tl.fromTo(
          label,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
          2.06,
        );

        /* Scene 3 (3.00-5.50) - one plate per spoken place name, then dead still */
        for (var i = 0; i < plates.length && i < CUES.length; i += 1) {
          var at = CUES[i];
          var plate = plates[i];
          tl.fromTo(
            plate.querySelector(".f03-jenksart-plate-rule"),
            { scaleX: 0 },
            { scaleX: 1, duration: 0.46, ease: "power3.out" },
            at,
          );
          tl.fromTo(
            plate.querySelector(".f03-jenksart-place"),
            { opacity: 0, x: -22 },
            { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
            at + 0.06,
          );
          tl.fromTo(
            plate.querySelector(".f03-jenksart-tick"),
            { scaleX: 0 },
            { scaleX: 1, duration: 0.4, ease: "power3.out" },
            at + 0.14,
          );
        }

        /* the grain field stays alive through the hold: a stepped, monotonic tween
           (no repeat, no yoyo) so every rendered frame resolves to one discrete state */
        tl.fromTo(
          grain,
          { xPercent: 0, yPercent: 0 },
          { xPercent: -6, yPercent: 4, duration: DURATION, ease: "steps(22)" },
          0,
        );

        tl.seek(0);
        paint(0);
        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;
      })();

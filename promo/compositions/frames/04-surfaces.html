  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var FIRE = "#e85d26";
      var CREAM = "#f0ece5";
      var HINT = "#505048";

      var plates = document.querySelectorAll(".hf04-grid .hf04-plate");

      /* ──────────────────────────────────────────────────────────────────
         Scene 1 (0.0–1.0s)  dark field · concrete ~55% · mural ghosted ~20%
                             "Gable ends" → plate 01 arrives upper-left
         Scene 2 (1.0–1.9s)  "Shopfronts" → plate 02 lands to its right
         Scene 3 (1.9–4.2s)  CAFÉS / GYMS / BARBERS / SCHOOLS cascade, one
                             per spoken word, border flashing fire-orange
                             then settling to cream-hint
         Scene 4 (4.2–5.3s)  "Kids' bedrooms" → plate 07 spans both columns
                             and flips register to ink-on-fire
         Scene 5 (5.3–8.0s)  grid dims · ink slab lands · "if it's got a
                             wall" (cream) then "he'll paint it" (fire)
         ────────────────────────────────────────────────────────────────── */

      // arrival schedule: [index, at, flashColour, settleAt]
      // Each arrival is the center-outward-expansion rule in its short-path /
      // "starting partially-spread" form: the plate slides a short distance
      // OUTWARD from the grid centre directly into its own slot (data-fx/fy
      // = 12% of the slot→centre vector), fade + faint scale, out-ease only,
      // low drama — no burst, no bounce.
      var ARRIVALS = [
        [0, 0.08, CREAM, 0.85],
        [1, 1.05, CREAM, 1.72],
        [2, 1.96, FIRE, 2.42],
        [3, 2.5, FIRE, 2.96],
        [4, 3.06, FIRE, 3.52],
        [5, 3.62, FIRE, 4.08],
        [6, 4.3, FIRE, -1],
      ];

      ARRIVALS.forEach(function (a) {
        var plate = plates[a[0]];
        var at = a[1];
        var num = plate.querySelector(".hf04-plate-num");
        var label = plate.querySelector(".hf04-plate-label");

        tl.set(plate, { borderColor: a[2] }, at);
        tl.fromTo(
          plate,
          { x: Number(plate.dataset.fx), y: Number(plate.dataset.fy), scale: 0.965, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.46, ease: "power3.out" },
          at,
        );
        // tight internal stagger — the plate frame lands, then its chrome
        tl.fromTo(
          label,
          { y: 14, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
          at + 0.09,
        );
        tl.fromTo(
          num,
          { y: 10, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.34, ease: "power3.out" },
          at + 0.15,
        );
        // the accent marks only the NEWEST arrival — older plates recede
        if (a[3] > 0) {
          tl.to(plate, { borderColor: HINT, duration: 0.4, ease: "power1.out" }, a[3]);
        }
      });

      // ── Scene 4 — plate 07 flips register: a HARD flat two-register flip
      // (fire-orange ground, ink reading on top). Instant, never tweened: a
      // tweened fill would pass through cream-on-orange / ink-on-dark, and
      // both are illegal in this system.
      var p7 = plates[6];
      var p7label = p7.querySelector(".hf04-plate-label");
      var p7num = p7.querySelector(".hf04-plate-num");

      tl.set(p7, { backgroundColor: "rgba(232,93,38,0)", borderColor: FIRE }, 0);
      tl.set(p7label, { color: CREAM }, 0);
      tl.set(p7num, { color: CREAM }, 0);

      tl.set(
        p7,
        { backgroundColor: "rgba(232,93,38,1)", borderColor: "rgba(17,17,17,0.20)" },
        4.48,
      );
      tl.set(p7label, { color: "#111111" }, 4.48);
      tl.set(p7num, { color: "#111111" }, 4.48);

      // ── Scene 5 — the grid dims beneath the payoff; static hold, no push-in
      var outlined = [plates[0], plates[1], plates[2], plates[3], plates[4], plates[5]];
      tl.to(outlined, { borderColor: HINT, duration: 0.5, ease: "power1.out" }, 5.32);
      tl.to(".hf04-grid-inner", { opacity: 0.38, duration: 0.55, ease: "power2.out" }, 5.32);
      tl.to(p7, { opacity: 0.5, duration: 0.55, ease: "power2.out" }, 5.32);

      // rows 2–3 sit directly beneath the opaque payoff slab, so their chrome
      // recedes fully as it lands — same dim beat, nothing readable is lost.
      tl.to(
        ".hf04-p3 .hf04-plate-num, .hf04-p3 .hf04-plate-label, .hf04-p4 .hf04-plate-num, .hf04-p4 .hf04-plate-label, .hf04-p5 .hf04-plate-num, .hf04-p5 .hf04-plate-label, .hf04-p6 .hf04-plate-num, .hf04-p6 .hf04-plate-label",
        { opacity: 0, duration: 0.3, ease: "power1.out" },
        5.3,
      );

      tl.fromTo(
        ".hf04-band",
        { opacity: 0 },
        { opacity: 0.94, duration: 0.45, ease: "power2.out" },
        5.38,
      );

      // payoff part A — "if it's got a wall", cream, on its own beat
      tl.fromTo(
        ".hf04-line-a",
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        5.48,
      );
      tl.fromTo(
        ".hf04-line-b",
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        5.56,
      );

      // payoff part B — "he'll paint it", fire-orange, landing on a later beat
      tl.fromTo(
        ".hf04-line-c",
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        6.3,
      );

      // last quiet beat — the system's only ornament, the 36×2 rule stub
      tl.fromTo(
        ".hf04-stub",
        { scaleX: 0, opacity: 1, transformOrigin: "0% 50%" },
        { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        7.05,
      );

      // ── grain field — deterministic stepped jitter on the one timeline
      var GRAIN_STEPS = [
        [0, 0],
        [-5, -5],
        [-10, 5],
        [5, -10],
        [-5, 15],
        [-10, 5],
        [15, 0],
        [0, 10],
        [-15, 0],
        [10, 5],
      ];
      var grainTex = document.querySelector(".hf04-grain-texture");
      var grain = { p: 0 };
      tl.to(
        grain,
        {
          p: 1,
          duration: 8,
          ease: "none",
          onUpdate: function () {
            var step = GRAIN_STEPS[Math.floor(grain.p * 160) % GRAIN_STEPS.length];
            gsap.set(grainTex, { xPercent: step[0], yPercent: step[1] });
          },
        },
        0,
      );

      // full-span anchor so the sub-composition timeline covers the whole shot
      tl.to({}, { duration: 7.55 }, 0);

      window.__timelines["04-surfaces"] = tl;
      tl.seek(0);
    })();

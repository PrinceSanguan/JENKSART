        // ── count-up engine ───────────────────────────────────────────────────
        // Reuses compositions/components/count-up.html's mechanism: every integer
        // the viewer sees is an AUTHORED ROW set at a fixed timeline position, so a
        // backward seek, or a second seek to the same time, renders the identical
        // value. Nothing reads the wall clock or a random source, no update callback
        // runs, and no tween cycles. Rows are computed once, synchronously, at build;
        // consecutive duplicates collapse so each set lands exactly at the instant
        // its value changes, at any render fps.
        function countRows(target, duration, ease) {
          var easeFn = gsap.parseEase(ease);
          var steps = Math.max(1, Math.round(duration * 120));
          var rows = [];
          var previous = null;
          for (var i = 0; i <= steps; i += 1) {
            var progress = i / steps;
            var text = String(Math.round(target * easeFn(progress)));
            if (text !== previous) {
              rows.push({ at: duration * progress, text: text });
              previous = text;
            }
          }
          return rows;
        }

        // counting-dynamic-scale: the value and the counter's transform scale run
        // at the SAME position on the SAME ease, so escalating weight and the climb
        // are one beat. Final type size is static CSS — only the transform moves.
        function mountCounter(tl, figure, valueElement, target, suffix, startScale, at, count) {
          var EASE = "power3.out";
          tl.fromTo(
            figure,
            { opacity: 0, y: 30 },
            { opacity: 1, y: 0, duration: 0.34, ease: EASE },
            at,
          );
          tl.fromTo(figure, { scale: startScale }, { scale: 1, duration: count, ease: EASE }, at);
          countRows(target, count, EASE).forEach(function (row) {
            tl.set(valueElement, { textContent: row.text + suffix }, at + row.at);
          });
        }

        function drawRail(tl, rail, at) {
          tl.fromTo(
            rail,
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
            at,

            { opacity: 1, y: 0, duration: duration, ease: "power2.out" },
            at,

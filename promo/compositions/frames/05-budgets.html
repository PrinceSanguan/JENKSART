<template id="05-budgets-template">
  <div
    id="root"
    data-composition-id="05-budgets"
    data-width="1080"
    data-height="1920"
    data-start="0"
    data-duration="4.52"
  >
    <!-- ============================================================
         Frame 5 — "prices to match budgets"  (5.5s · 1080x1920)
         The film's ONLY orange-register frame. The register FLIP is
         the drama; the held read is the payload. Exactly ONE move:
         the quote fades in + scales 95%->100% on power3, then the
         frame holds DEAD still to the cut.
         Register (frame.md): ground fire-orange, type ink-black,
         secondary = the ink-on-orange overlays. No cream on orange.
         ============================================================ -->

    <!-- track 0 — THE REGISTER. Full-bleed fire-orange ground on a
         clip layer (never on #root): the frame root is clip-gated at
         assembly, so a ground painted on the root is not dependable. -->
    <div class="fb-ground clip" data-start="0" data-duration="4.52" data-track-index="0"></div>

    <!-- track 1 — oversized ink quote mark, sitting BEHIND the type -->
    <div class="fb-qmark clip" data-start="0" data-duration="4.52" data-track-index="1">&#8220;</div>

    <!-- track 2 — Scene 1: mono label in the upper third -->
    <div class="fb-label clip" data-start="0" data-duration="4.52" data-track-index="2">
      AND BEFORE YOU ASK
    </div>

    <!-- track 3 — Scene 2: the quote. The one move lands it here. -->
    <div class="fb-quote clip" data-start="0" data-duration="4.52" data-track-index="3">
      <div class="fb-line">prices to</div>
      <div class="fb-line">match budgets</div>
    </div>

    <!-- track 4 — Scene 3: the attribution rail -->
    <div class="fb-attrib clip" data-start="0" data-duration="4.52" data-track-index="4">
      <div class="fb-rail"></div>
      <div class="fb-attrib-text">&#8212; JENKSART, IN HIS OWN WORDS</div>
    </div>

    <!-- track 5 — grain field carried over from the dark frames.
         Reuses compositions/components/grain-overlay.html's texture, but
         STATIC: the component's infinite keyframe loop is not seek-safe
         under the renderer's frame-by-frame capture. -->
    <div class="fb-grain clip" data-start="0" data-duration="4.52" data-track-index="5"></div>

    <style>
      /* === hf:canonical-fonts (orchestrator-injected) === */
      /* Staged by the orchestrator into assets/fonts/ — local files only, so the
         render performs no network fetch and stays deterministic. font-display:block
         keeps a fallback face from ever being captured mid-load. */
      @font-face { font-family: "Barlow"; font-style: normal; font-weight: 400; font-display: block;
        src: url("assets/fonts/barlow-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-style: normal; font-weight: 700; font-display: block;
        src: url("assets/fonts/barlow-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-style: normal; font-weight: 900; font-display: block;
        src: url("assets/fonts/barlow-latin-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: block;
        src: url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; font-display: block;
        src: url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"); }
/* === /hf:canonical-fonts === */

      

      

      /* Barlow ships no file with this project (assets/fonts is empty and
         nothing was staged), so it is declared against an installed copy
         only. Inter is the renderer's deterministic bundled fallback — it
         carries the 900 weight the broadside display ramp needs. Never a
         network font fetch. "IBM Plex Mono" is a canonical bundled family the
         renderer resolves on its own. */
      
      

      /* The container law: the frame ground carries container-type: size and
         every frame-relative unit is cqw against it (1cqw = 10.8px here). */
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        container-type: size;
      }

      #root * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ---- the orange register ---- */
      .fb-ground {
        position: absolute;
        inset: 0;
        background-color: #e85d26;
      }

      /* ---- oversized quote mark, 12% ink, behind the type ---- */
      .fb-qmark {
        position: absolute;
        left: 10px;
        top: 880px;
        font-family: "Barlow", sans-serif;
        font-weight: 900;
        font-size: 52cqw;
        line-height: 0.6;
        color: #111111;
        opacity: 0.12;
        white-space: nowrap;
      }

      /* ---- mono chrome: uppercase, 0.14em, ink overlay ----
         Re-stepped up from frame.md's 0.72cqw 16:9 label for the 9:16 frame
         (the legibility floor, and >=24px keeps the chrome inside WCAG AA). */
      .fb-label {
        position: absolute;
        left: 5.5cqw;
        top: 420px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-weight: 500;
        font-size: 2.4cqw;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(17, 17, 17, 0.75);
        white-space: nowrap;
      }

      /* ---- the one display moment: Barlow 900 lowercase, negative-tracked.
         Two lines, longest line ~71cqw (inside the 78cqw cap). The box spans
         pad-x to pad-x so transform-origin 50% 50% scales it about the frame
         centre; transform-origin is safe to set in CSS (only a CSS `transform`
         would be clobbered by the GSAP scale tween). ---- */
      .fb-quote {
        position: absolute;
        left: 5.5cqw;
        right: 5.5cqw;
        top: 888px;
        font-family: "Barlow", sans-serif;
        font-weight: 900;
        font-size: 10cqw;
        line-height: 0.92;
        letter-spacing: -0.04em;
        text-transform: lowercase;
        color: #111111;
        transform-origin: 50% 50%;
      }

      .fb-line {
        white-space: nowrap;
      }

      /* ---- attribution rail: 1px ink hairline + mono chrome ----
         frame.md's ink-on-orange-hint is 55% ink, but held at 24.8px that
         reads ~2.7:1 on fire-orange and fails the WCAG AA gate. The hint role
         is kept by recessing with size + weight (24.8px/400 under the label's
         25.9px/500) and lifting the ink to 70%. */
      .fb-attrib {
        position: absolute;
        left: 5.5cqw;
        top: 1200px;
      }

      .fb-rail {
        width: 470px;
        height: 1px;
        background-color: rgba(17, 17, 17, 0.2);
        transform-origin: left center;
      }

      .fb-attrib-text {
        margin-top: 26px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-weight: 400;
        font-size: 2.3cqw;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(17, 17, 17, 0.7);
        white-space: nowrap;
      }

      /* ---- static print grain over the whole field ---- */
      .fb-grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: multiply;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch' seed='7'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 256px 256px;
      }
    </style>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="05-budgets"]');
        if (!root || typeof gsap === "undefined") return;
        var pick = function (selector) {
          return root.querySelector(selector);
        };

        var qmark = pick(".fb-qmark");
        var label = pick(".fb-label");
        var quote = pick(".fb-quote");
        var rail = pick(".fb-rail");
        var attribText = pick(".fb-attrib-text");

        var tl = gsap.timeline({ paused: true });

        /* ---- Scene 1 (0.0-1.0s) — THE REGISTER FLIPS ON THE CUT ----
           The fire-orange ground and the grain are already painted at frame 0:
           the cut IS the flip, so nothing fades the ground in (the bass impact
           the assembler mounts lands on this frame). On "and before you ask",
           the mono label resolves in the upper third. */
        tl.fromTo(label, { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "power2.out" }, 0.1);

        /* ---- Scene 2 (1.0-3.3s) — THE ONE MOVE ----
           "prices to match budgets" fades in dead-centre while scaling
           95% -> 100% on a smooth power3. The oversized quote mark rises to
           its 12% ink on the same gesture (one reveal, not a second move).
           After this the type never moves again. */
        tl.fromTo(
          quote,
          { opacity: 0, scale: 0.95 },
          { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" },
          0.9,
        );
        tl.fromTo(qmark, { opacity: 0 }, { opacity: 0.12, duration: 1.15, ease: "power3.out" }, 0.9);

        /* ---- Scene 3 (3.3-5.5s) — the attribution fills in, then DEAD STILL.
           On "his words, not ours" the hairline rail wipes open from the left
           and the mono attribution fades up with no travel. From ~3.95s the
           frame holds absolutely still to the cut: no drift, no push, no
           breathing. This is the film's allocated breather. */
        tl.fromTo(rail, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 3.3);
        tl.fromTo(
          attribText,
          { opacity: 0 },
          { opacity: 1, duration: 0.5, ease: "power2.out" },
          3.45,
        );

        /* Hold the timeline open to the full 5.5s window with a no-op on an
           already-landed value — the stillness is the deliverable, so there is
           deliberately nothing animating across it (and no exit: the root
           transition the injector stamps is this frame's exit). */
        tl.to(rail, { scaleX: 1, duration: 0.01, ease: "none" }, 5.49);

        window.__timelines = window.__timelines || {};
        window.__timelines["05-budgets"] = tl;
        tl.seek(0);
      })();
    </script>
  </div>
</template>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #111111;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      30-second cut, built down from the 45s original.

      Four of the seven scenes are kept. The three dropped ones (04 surfaces,
      05 budgets, 06 proof) were not chosen by length alone: each remaining
      frame has hard-coded beats late in its own timeline — 02's display word
      lands at 5.6s, 04's last tween sits at 7.05s — so shortening a scene
      deletes its payoff. Four scenes at or above their native length is the
      only way to reach 30s with every animation still completing, so the
      scenes here are EXTENDED rather than trimmed, and the extra time is
      spent holding on the revealed mural and on the contact details.

      The voice-over drives the timing, not the other way round:
      assets/voice-30s.mp3 is cut from the original 45s take at its measured
      silence boundaries, with each kept line starting 0.2s after its scene
      cut — the same offset the original used.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-dead-wall"
        class="scene"
        data-composition-id="01-dead-wall"
        data-composition-src="compositions/frames/01-dead-wall.html"
        data-start="0"
        data-duration="5.00"
        data-track-index="1"
      ></div>

      <div
        id="el-02-the-turn"
        class="scene"
        data-composition-id="02-the-turn"
        data-composition-src="compositions/frames/02-the-turn.html"
        data-start="5.00"
        data-duration="8.40"
        data-track-index="1"
      ></div>

      <div
        id="el-03-jenksart"
        class="scene"
        data-composition-id="03-jenksart"
        data-composition-src="compositions/frames/03-jenksart.html"
        data-start="13.40"
        data-duration="7.97"
        data-track-index="1"
      ></div>

      <div
        id="el-07-cta"
        class="scene"
        data-composition-id="07-cta"
        data-composition-src="compositions/frames/07-cta.html"
        data-start="21.37"
        data-duration="8.63"
        data-track-index="1"
      ></div>

      <!-- VOICE — the 45s ElevenLabs take re-cut to four lines, landing at
           0.20 / 5.20 / 13.60 / 21.57. -->
      <audio
        id="el-voice"
        src="assets/voice-30s.mp3"
        data-start="0"
        data-duration="30"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- BGM — 60-90s of the same house track, fades and loudness matched to
           the original 45s bed. -->
      <audio
        id="el-bgm"
        src="assets/bgm-30s.mp3"
        data-start="0"
        data-duration="30"
        data-track-index="11"
        data-volume="0.25"
      ></audio>

      <!-- SFX — moved onto the new scene cuts. -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/impact-bass-1.mp3"
        data-start="5.00"
        data-duration="2.12"
        data-track-index="20"
        data-volume="0.26"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/whoosh-short.mp3"
        data-start="13.40"
        data-duration="0.57"
        data-track-index="21"
        data-volume="0.22"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/whoosh.mp3"
        data-start="21.37"
        data-duration="0.57"
        data-track-index="22"
        data-volume="0.2"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Barlow';
        src: url('../public/fonts/barlow-latin-900-normal.woff2') format('woff2');
        font-weight: 900;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('../public/fonts/IBMPlexMono-Medium.woff2') format('woff2');
        font-weight: 500;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1200px; height: 630px; overflow: hidden; background: #111111; }
      .card { position: relative; width: 1200px; height: 630px; display: flex; }

      .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* Left-weighted scrim so the type sits on near-solid ink while the mural
         still reads on the right. */
      .scrim {
        position: absolute; inset: 0;
        background: linear-gradient(100deg, #111111 30%, rgba(17,17,17,0.82) 52%, rgba(17,17,17,0.25) 100%);
      }

      .inner { position: relative; padding: 72px; display: flex; flex-direction: column; justify-content: space-between; }

      .kicker {
        font-family: 'IBM Plex Mono', monospace; font-weight: 500;
        font-size: 19px; letter-spacing: 0.22em; text-transform: uppercase; color: #e85d26;
      }
      .word {
        font-family: 'Barlow', sans-serif; font-weight: 900;
        font-size: 150px; line-height: 0.84; letter-spacing: -0.045em;
        text-transform: uppercase; color: #f0ece5;
      }
      .word.outline {
        -webkit-text-stroke: 3px #f0ece5;
        -webkit-text-fill-color: transparent;
        paint-order: stroke fill;
      }
      .sub {
        font-family: 'Barlow', sans-serif; font-size: 28px; color: rgba(240,236,229,0.78);
        max-width: 560px; margin-top: 26px; line-height: 1.35;
      }
      .foot {
        font-family: 'IBM Plex Mono', monospace; font-weight: 500;
        font-size: 17px; letter-spacing: 0.2em; text-transform: uppercase;
        color: rgba(240,236,229,0.5);
      }
      .foot b { color: #e85d26; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="photo" src="../public/murals/cyberpunk-twins-hoarding.jpg" alt="" />
      <div class="scrim"></div>
      <div class="inner">
        <div class="kicker">Welsh street artist &amp; muralist</div>
        <div>
          <div class="word">Jenks</div>
          <div class="word outline">Art</div>
          <div class="sub">Murals for homes, shopfronts and whole communities across Swansea, Llanelli and South Wales.</div>
        </div>
        <div class="foot">Llanelli · Swansea · Carmarthenshire &nbsp;·&nbsp; <b>Prices to match budgets</b></div>
      </div>
    </div>
  </body>
</html>
